[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medica-geometrica"
version = "0.1.0"
description = "Research simulation software for geometric organism-state modeling. Not a diagnostic system."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Steven Leake", email = "indigomoon1986@gmail.com"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
dev = ["pytest>=7.4"]

[project.scripts]
medica-geometrica = "medica.app.cli:main"

[tool.setuptools.packages.find]
include = ["medica*"]
